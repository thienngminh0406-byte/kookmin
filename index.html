<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국민대학교 근처 자취방 리스트</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1120;
    --panel: #121b2e;
    --panel-2: #17233b;
    --border: #223252;
    --text: #e7ecf3;
    --muted: #8fa0be;
    --teal: #2dd4bf;
    --gold: #e3b341;
    --ziptoss: #60a5fa;
    --gobang: #ff7a1a;
    --daangn: #ff8a3d;
    --dgdr: #a78bfa;
    --site: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10, 17, 32, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 16px;
  }
  header h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -0.01em; }
  header h1 span { color: var(--teal); }
  header p.sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

  .platform-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .platform-tab {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .platform-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .platform-tab.active { color: var(--text); border-color: currentColor; }
  .platform-tab[data-pf="pf-ziptoss"].active { color: var(--ziptoss); }
  .platform-tab[data-pf="pf-ziptoss"] .dot { background: var(--ziptoss); }
  .platform-tab[data-pf="pf-gobang"].active { color: var(--gobang); }
  .platform-tab[data-pf="pf-gobang"] .dot { background: var(--gobang); }
  .platform-tab[data-pf="pf-daangn"].active { color: var(--daangn); }
  .platform-tab[data-pf="pf-daangn"] .dot { background: var(--daangn); }
  .platform-tab[data-pf="pf-dgdr"].active { color: var(--dgdr); }
  .platform-tab[data-pf="pf-dgdr"] .dot { background: var(--dgdr); }
  .platform-tab[data-pf="pf-site"].active { color: var(--site); }
  .platform-tab[data-pf="pf-site"] .dot { background: var(--site); }
  .platform-tab .count { color: var(--muted); font-size: 11px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls input[type="text"], .controls select, .controls input[type="number"] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit;
  }
  .controls input[type="text"] { flex: 1 1 220px; min-width: 160px; }
  .controls input[type="number"] { width: 110px; }

  .stats { display: flex; gap: 22px; padding: 14px 28px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .label { font-size: 11px; color: var(--muted); }
  .stat .value { font-size: 18px; font-weight: 600; }
  .stat .value.teal { color: var(--teal); }
  .stat .value.gold { color: var(--gold); }

  main { padding: 20px 28px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

  .card {
    position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 16px 14px; transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--teal); transform: translateY(-2px); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tag.warn { color: var(--gold); border-color: rgba(227,179,65,0.4); background: rgba(227,179,65,0.06); }
  .tag.pf-ziptoss { color: var(--ziptoss); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.08); }
  .tag.pf-gobang { color: var(--gobang); border-color: rgba(255,122,26,0.4); background: rgba(255,122,26,0.08); }
  .tag.pf-daangn { color: var(--daangn); border-color: rgba(255,138,61,0.4); background: rgba(255,138,61,0.08); }
  .tag.pf-dgdr { color: var(--dgdr); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
  .tag.pf-site { color: var(--site); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.08); }

  .distpill {
    flex-shrink: 0; text-align: right; background: rgba(45,212,191,0.08);
    border: 1px solid rgba(45,212,191,0.35); border-radius: 8px; padding: 4px 8px;
  }
  .distpill .n { color: var(--teal); font-weight: 700; font-size: 13px; }
  .distpill .l { color: var(--muted); font-size: 9px; letter-spacing: 0.02em; }

  .building { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .address { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
  .address .approx { color: var(--gold); font-size: 11px; }

  .price-row { display: flex; gap: 18px; margin-bottom: 10px; flex-wrap: wrap; }
  .price-row .item .l { font-size: 10.5px; color: var(--muted); margin-bottom: 1px; }
  .price-row .item .n { font-size: 17px; font-weight: 600; }

  .meta {
    display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted);
    border-top: 1px dashed var(--border); padding-top: 10px; margin-bottom: 10px;
  }
  .meta b { color: var(--text); font-weight: 500; }

  .notes {
    font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 0 12px;
    background: var(--panel-2); border-radius: 8px; padding: 9px 11px;
  }

  .action-btn {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 12.5px; font-weight: 600; color: #06251f; text-decoration: none;
    background: var(--teal); border-radius: 8px; padding: 10px; text-align: center;
  }
  .action-btn:hover { filter: brightness(1.08); }
  .action-btn.disabled {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
    pointer-events: none;
  }

  .empty { text-align: center; color: var(--muted); padding: 80px 20px; }
  .empty button {
    margin-top: 12px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-family: inherit;
  }

  .footnote { max-width: 900px; margin: 30px auto 0; padding: 14px 16px; color: var(--muted);
    font-size: 12px; line-height: 1.6; border-top: 1px dashed var(--border); }

  @media (max-width: 520px) {
    header, .stats, main { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>🏠 <span>국민대학교</span> 근처 자취방 리스트</h1>
  <p class="sub">집토스·고방·당근부동산·동거동락 등에서 직접 확인한 매물 모음 · 클릭하면 원본 매물로 바로 이동</p>
  <div class="platform-tabs" id="platformTabs"></div>
  <div class="controls">
    <input type="text" id="q" placeholder="이름, 동네로 검색">
    <select id="typeFilter"></select>
    <input type="number" id="maxRent" placeholder="최대 월세(만원)">
    <select id="maxDistance">
      <option value="">거리 상관없음</option>
      <option value="0.5">0.5km 이내</option>
      <option value="1">1km 이내</option>
      <option value="2">2km 이내</option>
      <option value="3">3km 이내</option>
    </select>
    <select id="sort">
      <option value="distance">학교와 가까운 순</option>
      <option value="rentMin">월세 낮은 순</option>
    </select>
  </div>
</header>

<div class="stats" id="stats"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    조건에 맞는 매물이 없어요. 검색어나 필터를 조정해보세요.
    <br><button id="resetBtn">필터 초기화</button>
  </div>
  <p class="footnote">
    ※ 거리 값 중 일부("정성적 표현", "도보시간 환산", "동일 동 시설 기준 추정")는 정확한 실측이 아니라
    출처 페이지의 설명이나 인근 시설을 근거로 한 추정치입니다. 카드에 표시된 거리 산출방식을 참고하세요.
    보증금·월세·옵션 등은 수집 시점 기준이며 실제 계약 전 반드시 출처 링크에서 최신 정보를 다시 확인하세요.
  </p>
</main>

const PLATFORM_ORDER = [...new Set(DATA.map(d => d.platform))];

const els = {
  q: document.getElementById('q'),
  typeFilter: document.getElementById('typeFilter'),
  maxRent: document.getElementById('maxRent'),
  maxDistance: document.getElementById('maxDistance'),
  sort: document.getElementById('sort'),
  grid: document.getElementById('grid'),
  empty: document.getElementById('empty'),
  stats: document.getElementById('stats'),
  resetBtn: document.getElementById('resetBtn'),
  platformTabs: document.getElementById('platformTabs'),
};

let activePlatforms = new Set(PLATFORM_ORDER);

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function setupTypeOptions() {
  const types = [...new Set(DATA.map(d => d.type).filter(Boolean))].sort();
  els.typeFilter.innerHTML = '<option value="all">매물유형 전체</option>' +
    types.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
}

function setupPlatformTabs() {
  const counts = {};
  PLATFORM_ORDER.forEach(p => counts[p] = 0);
  DATA.forEach(d => { counts[d.platform] = (counts[d.platform] || 0) + 1; });

  els.platformTabs.innerHTML = PLATFORM_ORDER.map(p => {
    const sample = DATA.find(d => d.platform === p);
    return `
      <div class="platform-tab active" data-pf="${sample.platformClass}" data-platform="${escapeHtml(p)}">
        <span class="dot"></span>${escapeHtml(sample.platformShort)} <span class="count">${counts[p]}</span>
      </div>`;
  }).join('');

  els.platformTabs.querySelectorAll('.platform-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const p = tab.dataset.platform;
      if (activePlatforms.has(p)) {
        if (activePlatforms.size === 1) return;
        activePlatforms.delete(p);
        tab.classList.remove('active');
      } else {
        activePlatforms.add(p);
        tab.classList.add('active');
      }
      applyFilters();
    });
  });
}

  const q = els.q.value.trim().toLowerCase();
  const type = els.typeFilter.value;
  const maxRent = parseFloat(els.maxRent.value);
  const maxDistance = parseFloat(els.maxDistance.value);

  let list = DATA.filter(d => {
    if (!activePlatforms.has(d.platform)) return false;
    if (q && !((d.name || '').toLowerCase().includes(q) || (d.address || '').toLowerCase().includes(q))) return false;
    if (type !== 'all' && d.type !== type) return false;
    if (!isNaN(maxRent) && d.rentMin != null && d.rentMin > maxRent) return false;
    if (!isNaN(maxDistance) && (d.distanceKm ?? Infinity) > maxDistance) return false;
    return true;
  });

  const sort = els.sort.value;
  const byNum = (key) => (a, b) => (a[key] ?? Infinity) - (b[key] ?? Infinity);
  if (sort === 'distance') list.sort(byNum('distanceKm'));
  else if (sort === 'rentMin') list.sort(byNum('rentMin'));

  render(list);
}

function cardHtml(d) {
  const dist = (d.distanceKm ?? null) !== null ? `${d.distanceKm}km` : '거리 미확인';
  const isApprox = d.distanceMethod && d.distanceMethod !== '명시';
  const rentText = (d.rentMin != null && d.rentMax != null)
    ? (d.rentMin === d.rentMax ? `${d.rentMin}만원` : `${d.rentMin}~${d.rentMax}만원`)
    : (d.rentRaw || '문의 필요');
  const depositText = d.deposit && d.deposit !== 'nan' ? d.deposit : '정보없음';

  return `
    <div class="card">
      <div class="card-top">
        <div class="tags">
          <span class="tag ${d.platformClass}">${escapeHtml(d.platformShort)}</span>
          <span class="tag">${escapeHtml(d.type)}</span>
          ${isApprox ? `<span class="tag warn">📍 ${escapeHtml(d.distanceMethod)}</span>` : ''}
        </div>
        <div class="distpill">
          <div class="n mono">${dist}</div>
          <div class="l">학교까지</div>
        </div>
      </div>
      <p class="building">${escapeHtml(d.name)}</p>
      <p class="address">${escapeHtml(d.address)}</p>
      <div class="price-row">
        <div class="item">
          <div class="l">월세</div>
          <div class="n mono">${escapeHtml(rentText)}</div>
        </div>
        <div class="item">
          <div class="l">보증금</div>
          <div class="n mono">${escapeHtml(depositText)}${/^[0-9]+$/.test(depositText) ? '<span style="font-size:11px;color:var(--muted)">만원</span>' : ''}</div>
        </div>
      </div>
      <div class="meta">
        <span>🚽 <b>${escapeHtml(d.privateBathroom)}</b></span>
        <span>❄️ <b>${escapeHtml(d.ac)}</b></span>
        <span>🧾 관리비 <b>${escapeHtml(d.maintenance)}</b></span>
      </div>
      ${d.notes ? `<p class="notes">${escapeHtml(d.notes)}</p>` : ''}
      ${d.sourceUrl
        ? `<a class="action-btn" href="${escapeHtml(d.sourceUrl)}" target="_blank" rel="noopener">매물 보러가기 →</a>`
        : `<span class="action-btn disabled">전화 문의 필요</span>`}
    </div>
  `;
}

function render(list) {
  els.empty.style.display = list.length ? 'none' : 'block';
  els.grid.style.display = list.length ? 'grid' : 'none';
  els.grid.innerHTML = list.map(cardHtml).join('');
  renderStats(list);
}

function renderStats(list) {
  if (!list.length) { els.stats.innerHTML = ''; return; }
  const withRent = list.filter(d => d.rentMin != null);
  const avgRent = withRent.length ? Math.round(withRent.reduce((s, d) => s + d.rentMin, 0) / withRent.length) : null;
  const minRent = withRent.length ? Math.min(...withRent.map(d => d.rentMin)) : null;

  els.stats.innerHTML = `
    <div class="stat"><span class="label">매물 수</span><span class="value teal mono">${list.length}건</span></div>
    <div class="stat"><span class="label">최저 월세</span><span class="value gold mono">${minRent ?? '-'}만원</span></div>
    <div class="stat"><span class="label">평균 월세(최소가 기준)</span><span class="value mono">${avgRent ?? '-'}만원</span></div>
  `;
}

els.resetBtn.addEventListener('click', () => {
  els.q.value = ''; els.typeFilter.value = 'all'; els.maxRent.value = ''; els.maxDistance.value = ''; els.sort.value = 'distance';
  activePlatforms = new Set(PLATFORM_ORDER);
  els.platformTabs.querySelectorAll('.platform-tab').forEach(t => t.classList.add('active'));
  applyFilters();
});

[els.q, els.typeFilter, els.maxRent, els.maxDistance, els.sort].forEach(el => {
  el.addEventListener('input', applyFilters);
});

setupTypeOptions();
setupPlatformTabs();
applyFilters();
</script>
</body>
</html>
